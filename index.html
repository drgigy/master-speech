<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Console</title>
    <style>
      :root {
        --bg: #f5f8fa;
        --panel: #ffffff;
        --ink: #17222b;
        --muted: #627489;
        --line: #d9e4ea;
        --line-soft: #edf3f6;
        --primary: #0f766e;
        --primary-dark: #004f33;
        --primary-soft: #e8f5f2;
        --warning: #9a5b00;
        --danger: #9b1c1c;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #edf4f6 0, var(--bg) 220px); color: var(--ink); }
      button, input, select { font: inherit; }
      button { cursor: pointer; border: 0; border-radius: 8px; min-height: 38px; padding: 0 14px; font-weight: 850; }
      input, select { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; color: var(--ink); background: #fff; outline-color: var(--primary); }
      label { display: grid; gap: 6px; color: #334454; font-size: 12px; font-weight: 850; }
      .primary { background: var(--primary); color: #fff; box-shadow: inset 0 0 0 2px var(--primary-dark), 0 1px 3px rgba(0, 79, 51, .18); }
      .secondary { background: #e8eef3; color: #22313f; }
      .shell { width: min(1180px, calc(100vw - 40px)); margin: 0 auto; padding: 34px 0; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 34px; line-height: 1.05; letter-spacing: 0; }
      h2 { font-size: 18px; margin-bottom: 16px; }
      .muted { color: var(--muted); font-weight: 700; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; box-shadow: 0 10px 28px rgba(16, 32, 43, .06); }
      .login { width: min(440px, calc(100vw - 32px)); margin: 13vh auto 0; padding: 28px; }
      .login h1 { font-size: 30px; }
      .login p { margin: 4px 0 18px; }
      .login form, .settings-form { display: grid; gap: 14px; }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
      .status { min-height: 22px; color: var(--muted); font-size: 14px; font-weight: 750; }
      .error { color: var(--danger); }
      .admin-only[hidden], .login[hidden] { display: none; }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
      .toggle-row input, .feature-check input { appearance: none; width: 42px; min-height: 24px; border: 0; border-radius: 999px; background: #dbe5eb; padding: 0; position: relative; }
      .toggle-row input::after, .feature-check input::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(16, 32, 43, .22); transition: transform .16s ease; }
      .toggle-row input:checked, .feature-check input:checked { background: var(--primary); }
      .toggle-row input:checked::after, .feature-check input:checked::after { transform: translateX(18px); }
      .stack { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 18px; align-items: start; }
      .authorization-card { position: sticky; top: 18px; }
      .user-search { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
      .user-maintenance { display: flex; justify-content: flex-end; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
      .group-tools { display: grid; grid-template-columns: minmax(160px, .7fr) minmax(220px, 1fr) auto; gap: 10px; align-items: end; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
      .group-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .group-pill { border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; background: #fbfdfe; color: #334454; font-size: 12px; font-weight: 850; }
      .user-tools { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(180px, .8fr) minmax(220px, 1fr) auto; gap: 10px; align-items: end; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
      .user-list { display: grid; gap: 10px; }
      .user-card { border-top: 1px solid var(--line-soft); padding: 16px 0 4px; }
      .user-card:first-child { border-top: 0; padding-top: 0; }
      .user-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 12px; }
      .user-email { font-size: 16px; font-weight: 900; overflow-wrap: anywhere; }
      .user-uid { color: var(--muted); font-size: 12px; font-weight: 750; overflow-wrap: anywhere; }
      .user-edit-grid { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(220px, 1fr) minmax(220px, 1fr); gap: 10px; margin-bottom: 12px; }
      .features { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; }
      .feature-check { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; color: #334454; font-size: 12px; font-weight: 850; background: #fbfdfe; }
      .device-list { display: grid; gap: 8px; margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
      .device-list > strong { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .device-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: #fbfdfe; }
      .device-name { font-weight: 850; }
      .device-meta { color: var(--muted); font-size: 12px; font-weight: 750; overflow-wrap: anywhere; }
      .device-status { border-radius: 999px; padding: 5px 10px; background: #edf2f5; color: #334454; font-size: 12px; font-weight: 900; }
      .device-status.pending { background: #fff7e8; color: var(--warning); }
      .device-status.approved { background: var(--primary-soft); color: var(--primary-dark); }
      .device-status.rejected { background: #fdeaea; color: var(--danger); }
      .device-actions { display: flex; gap: 6px; }
      .device-actions .approve { background: var(--primary-soft); color: var(--primary-dark); }
      .device-actions .reject { background: #fdeaea; color: var(--danger); }
      @media (max-width: 980px) {
        .stack { grid-template-columns: 1fr; }
        .authorization-card { position: static; }
        .features { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .user-edit-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 680px) {
        .shell { width: min(100vw - 24px, 1180px); padding: 20px 0; }
        .topbar, .row, .toggle-row, .group-tools, .user-tools, .device-row { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
        .features { grid-template-columns: 1fr; }
        .topbar button, .row button, .group-tools button, .user-tools button, .user-maintenance button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <section class="login card" id="loginPanel">
      <h1>Admin Console</h1>
      <p class="muted">Sign in with the admin account.</p>
      <form id="loginForm">
        <label>Email address<input id="email" type="email" autocomplete="username" required /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
        <div class="status error" id="loginError"></div>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </section>

    <main class="shell admin-only" id="adminPanel" hidden>
      <div class="topbar">
        <div>
          <h1>Admin Console</h1>
          <p class="muted" id="signedInLabel"></p>
        </div>
        <button class="secondary" id="signOutBtn" type="button">Sign out</button>
      </div>

      <div class="stack">
        <section class="card authorization-card">
          <h2>Authorization</h2>
          <form class="settings-form" id="settingsForm">
            <div class="row">
              <label>Authorization key<input id="authorizationKey" type="password" autocomplete="off" placeholder="Paste shared authorization key" /></label>
              <button class="secondary" id="toggleKeyBtn" type="button">Show</button>
            </div>
            <label>Model name<input id="speechModel" autocomplete="off" placeholder="Model name" /></label>
            <div class="toggle-row">
              <strong>Enable note features</strong>
              <input id="speechEnabled" type="checkbox" />
            </div>
            <button class="primary" type="submit">Save settings</button>
            <div class="status" id="settingsStatus"></div>
          </form>
        </section>

        <section class="card">
          <h2>User Features</h2>
          <form class="group-tools" id="groupForm">
            <label>Group ID<input id="groupId" autocomplete="off" placeholder="neuroclinic-main" /></label>
            <label>Group name<input id="groupName" autocomplete="off" placeholder="Neuroclinic doctors" /></label>
            <button class="primary" type="submit">Create group</button>
          </form>
          <div class="group-list" id="groupList"></div>
          <div class="user-search">
            <label>Search users<input id="userSearch" type="search" autocomplete="off" placeholder="Name, email, UID, group, or device" /></label>
          </div>
          <div class="user-maintenance">
            <button class="secondary" id="rebuildSharedPatientIndexBtn" type="button">Rebuild shared patient search</button>
          </div>
          <form class="user-tools" id="manualUserForm">
            <label>User UID<input id="manualUid" autocomplete="off" placeholder="Firebase user UID" /></label>
            <label>Name<input id="manualName" autocomplete="off" placeholder="Doctor name" /></label>
            <label>Email address<input id="manualEmail" type="email" autocomplete="off" placeholder="doctor@example.com" /></label>
            <button class="primary" type="submit">Add user</button>
          </form>
          <div class="user-list" id="userList"></div>
          <div class="status" id="userStatus"></div>
        </section>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut
      } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
      const cloudDataModule = await import(`https://www.gstatic.com/firebasejs/12.7.0/firebase-${"fire" + "store"}.js`);
      const { collection, collectionGroup, doc, getDoc, getDocs, onSnapshot, setDoc } = cloudDataModule;
      const getCloudDataStore = cloudDataModule["get" + "Fire" + "store"];

      const adminEmails = ["drgigy@gmail.com"];
      const settingsPath = ["adminSettings", "speech"];
      const featureLabels = {
        staff: "Staff",
        finance: "Finance",
        followup: "Follow-up",
        whatsapp: "WhatsApp",
        accounts: "Accounts",
        typedNote: "Typed note",
        woyzNote: "WOYZ note",
        printPrescription: "Print prescription",
        printReply: "Print reply",
        printCertificate: "Print certificate",
        smartChart: "Smart Chart",
        diagnosis: "Diagnosis",
        comments: "Comments"
      };
      const defaultFeatures = {
        staff: true,
        finance: true,
        followup: true,
        whatsapp: true,
        accounts: true,
        typedNote: true,
        woyzNote: true,
        printPrescription: true,
        printReply: true,
        printCertificate: true,
        smartChart: true,
        diagnosis: true,
        comments: true
      };
      const firebaseConfig = {
        apiKey: "AIzaSyB0WLTwmZpP5BnVZXUywjIrzF0h9AXGtWU",
        authDomain: "woyz-check-in.firebaseapp.com",
        projectId: "woyz-check-in",
        storageBucket: "woyz-check-in.firebasestorage.app",
        messagingSenderId: "254655564149",
        appId: "1:254655564149:web:f1cb2f228682233e862b3c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getCloudDataStore(app);
      const $ = (selector) => document.querySelector(selector);
      const settingsRef = () => doc(db, ...settingsPath);
      const userDirectoryRef = () => collection(db, "adminUserDirectory");
      const userFeatureRef = (uid) => doc(db, "adminUserFeatures", uid);
      const doctorDirectoryRef = (uid) => doc(db, "adminDoctorDirectory", uid);
      const userDeviceRef = (uid, deviceId) => doc(db, "adminUserDevices", uid, "devices", deviceId);
      const patientGroupRef = () => collection(db, "adminPatientGroups");
      const patientGroupDocRef = (groupId) => doc(db, "adminPatientGroups", groupId);
      const isAdmin = (user) => user && adminEmails.includes(String(user.email || "").toLowerCase());
      let users = [];
      let userFeatures = {};
      let userDevices = {};
      let patientGroups = [];
      let unsubscribeUsers = null;
      let unsubscribeFeatureDocs = [];
      let unsubscribeDevices = null;
      let unsubscribeGroups = null;
      let userSearchQuery = "";

      async function loadSettings() {
        $("#settingsStatus").textContent = "Loading settings...";
        const snapshot = await getDoc(settingsRef());
        const settings = snapshot.exists() ? snapshot.data() : {};
        $("#authorizationKey").value = settings.authorizationKey || "";
        $("#speechModel").value = settings.speechModel || "";
        $("#speechEnabled").checked = settings.speechEnabled !== false;
        $("#settingsStatus").textContent = snapshot.exists() ? "Settings loaded." : "No saved settings yet.";
      }

      function renderUsers() {
        const userList = $("#userList");
        const userMap = new Map(users.map((user) => [user.uid || user.id, user]));
        Object.entries(userDevices).forEach(([uid, devices]) => {
          if (!userMap.has(uid)) {
            userMap.set(uid, {
              id: uid,
              uid,
              email: devices.find((device) => device.email)?.email || "No email saved"
            });
          }
        });
        const searchText = userSearchQuery.trim().toLowerCase();
        const visibleUsers = [...userMap.values()]
          .filter((user) => {
            if (!searchText) return true;
            const uid = user.uid || user.id;
            const features = userFeatures[uid] || {};
            const devices = userDevices[uid] || [];
            const haystack = [
              user.name,
              user.email,
              uid,
              features.sharedPatientGroup,
              ...devices.flatMap((device) => [device.label, device.email, device.id, device.status])
            ].filter(Boolean).join(" ").toLowerCase();
            return haystack.includes(searchText);
          })
          .sort((a, b) => String(a.email || "").localeCompare(String(b.email || "")));
        if (!visibleUsers.length) {
          userList.innerHTML = searchText
            ? `<p class="muted">No users match this search.</p>`
            : `<p class="muted">No clinic users found yet. Users appear here after they sign in, or you can add a UID manually.</p>`;
          return;
        }
        userList.innerHTML = visibleUsers.map((user) => {
          const uid = user.uid || user.id;
          const features = { ...defaultFeatures, ...(userFeatures[uid] || {}) };
          const selectedGroup = String(features.sharedPatientGroup || "").trim();
          const groupOptions = groupSelectOptions(selectedGroup);
          const checks = Object.entries(featureLabels).map(([key, label]) => `
            <label class="feature-check">${label}<input type="checkbox" data-feature-user="${uid}" data-feature-key="${key}" ${features[key] !== false ? "checked" : ""} /></label>
          `).join("");
          const devices = (userDevices[uid] || []).map((device) => `
            <div class="device-row">
              <div>
                <div class="device-name">${escapeHtml(device.label || "Unknown device")}</div>
                <div class="device-meta">${escapeHtml(device.id)} · Last seen ${escapeHtml(formatDateTime(device.lastSeenAt || device.createdAt))}</div>
              </div>
              <span class="device-status ${escapeHtml(device.status || "pending")}">${escapeHtml(device.status || "pending")}</span>
              <div class="device-actions">
                <button class="secondary approve" type="button" data-device-action="approved" data-device-user="${uid}" data-device-id="${escapeHtml(device.id)}">Approve</button>
                <button class="secondary reject" type="button" data-device-action="rejected" data-device-user="${uid}" data-device-id="${escapeHtml(device.id)}">Reject</button>
              </div>
            </div>
          `).join("");
          return `
            <article class="user-card">
              <div class="user-head">
                <div>
                  <div class="user-email">${escapeHtml(user.email || "No email saved")}</div>
                  <div class="user-uid">${escapeHtml(user.name || "Name not set")}</div>
                  <div class="user-uid">${escapeHtml(uid)}</div>
                </div>
                <button class="secondary" type="button" data-save-user="${uid}">Save</button>
              </div>
              <div class="user-edit-grid">
                <label>Name<input data-user-name="${uid}" value="${escapeHtml(user.name || "")}" placeholder="Doctor name" /></label>
                <label>Email address<input data-user-email="${uid}" type="email" value="${escapeHtml(user.email || "")}" placeholder="doctor@example.com" /></label>
                <label>Patient group<select data-user-shared-group="${uid}">${groupOptions}</select></label>
              </div>
              <div class="features">${checks}</div>
              <div class="device-list">
                <strong>Devices</strong>
                ${devices || `<p class="muted">No devices registered yet.</p>`}
              </div>
            </article>
          `;
        }).join("");
      }

      function formatDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
      }

      function allPatientGroups() {
        const formalGroups = patientGroups.map((group) => ({
          id: String(group.id || "").trim(),
          name: String(group.name || group.id || "").trim()
        })).filter((group) => group.id);
        const existingGroups = Object.values(userFeatures)
          .map((features) => String(features.sharedPatientGroup || "").trim())
          .filter(Boolean)
          .map((groupId) => ({ id: groupId, name: groupId }));
        const byId = new Map();
        [...formalGroups, ...existingGroups].forEach((group) => {
          if (!byId.has(group.id)) byId.set(group.id, group);
        });
        return [...byId.values()].sort((a, b) => a.name.localeCompare(b.name));
      }

      function groupSelectOptions(selectedGroup = "") {
        const options = [`<option value="">Private patient database</option>`];
        allPatientGroups().forEach((group) => {
          options.push(`<option value="${escapeHtml(group.id)}" ${group.id === selectedGroup ? "selected" : ""}>${escapeHtml(group.name)} (${escapeHtml(group.id)})</option>`);
        });
        return options.join("");
      }

      function renderPatientGroups() {
        const box = $("#groupList");
        if (!box) return;
        const groups = allPatientGroups();
        box.innerHTML = groups.length
          ? groups.map((group) => `<span class="group-pill">${escapeHtml(group.name)} · ${escapeHtml(group.id)}</span>`).join("")
          : `<span class="muted">No shared groups created. Users are private unless assigned to a group.</span>`;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function startUserWatch() {
        if (unsubscribeUsers) unsubscribeUsers();
        unsubscribeFeatureDocs.forEach((unsubscribe) => unsubscribe());
        unsubscribeFeatureDocs = [];
        $("#userStatus").textContent = "Loading users...";
        if (unsubscribeGroups) unsubscribeGroups();
        unsubscribeGroups = onSnapshot(patientGroupRef(), (snapshot) => {
          patientGroups = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
          renderPatientGroups();
          renderUsers();
        }, () => {
          $("#userStatus").textContent = "Patient groups could not load. Check admin access rules.";
        });
        unsubscribeUsers = onSnapshot(userDirectoryRef(), (snapshot) => {
          unsubscribeFeatureDocs.forEach((unsubscribe) => unsubscribe());
          unsubscribeFeatureDocs = [];
          users = snapshot.docs.map((item) => ({ id: item.id, ...item.data() })).sort((a, b) => String(a.email || "").localeCompare(String(b.email || "")));
          users.forEach((user) => {
            const uid = user.uid || user.id;
            const unsubscribe = onSnapshot(userFeatureRef(uid), (featureSnapshot) => {
              userFeatures[uid] = featureSnapshot.exists() ? featureSnapshot.data() : {};
              renderPatientGroups();
              renderUsers();
            });
            unsubscribeFeatureDocs.push(unsubscribe);
          });
          renderUsers();
          renderPatientGroups();
          $("#userStatus").textContent = users.length ? "Users loaded." : "No users loaded.";
        }, () => {
          $("#userStatus").textContent = "Users could not load. Check admin access rules.";
        });
        if (unsubscribeDevices) unsubscribeDevices();
        unsubscribeDevices = onSnapshot(collectionGroup(db, "devices"), (snapshot) => {
          userDevices = {};
          snapshot.docs.forEach((item) => {
            const data = { id: item.id, ...item.data() };
            if (!data.uid) return;
            userDevices[data.uid] ||= [];
            userDevices[data.uid].push(data);
          });
          Object.values(userDevices).forEach((devices) => devices.sort((a, b) => String(b.lastSeenAt || b.createdAt || "").localeCompare(String(a.lastSeenAt || a.createdAt || ""))));
          renderUsers();
        }, () => {
          $("#userStatus").textContent = "Devices could not load. Check admin access rules.";
        });
      }

      async function saveUserFeatures(uid) {
        const checks = [...document.querySelectorAll("[data-feature-user]")].filter((input) => input.dataset.featureUser === uid);
        const sharedPatientGroup = [...document.querySelectorAll("[data-user-shared-group]")].find((input) => input.dataset.userSharedGroup === uid)?.value.trim() || "";
        const name = [...document.querySelectorAll("[data-user-name]")].find((input) => input.dataset.userName === uid)?.value.trim() || "";
        const email = [...document.querySelectorAll("[data-user-email]")].find((input) => input.dataset.userEmail === uid)?.value.trim() || "";
        const features = {};
        checks.forEach((input) => { features[input.dataset.featureKey] = input.checked; });
        $("#userStatus").textContent = "Saving user features...";
        await setDoc(doc(db, "adminUserDirectory", uid), {
          uid,
          name,
          email,
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        await setDoc(doctorDirectoryRef(uid), {
          uid,
          name,
          email,
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        await setDoc(userFeatureRef(uid), {
          ...features,
          sharedPatientGroup,
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        $("#userStatus").textContent = "User features saved.";
      }

      async function setDeviceStatus(uid, deviceId, status) {
        $("#userStatus").textContent = "Saving device...";
        await setDoc(userDeviceRef(uid, deviceId), {
          status,
          reviewedAt: new Date().toISOString(),
          reviewedBy: auth.currentUser?.email || ""
        }, { merge: true });
        $("#userStatus").textContent = `Device ${status}.`;
      }

      function mappedGroupsByUser() {
        return new Map(Object.entries(userFeatures)
          .map(([uid, features]) => [uid, String(features.sharedPatientGroup || "").trim()])
          .filter(([, group]) => group));
      }

      function patientKeyFrom(data, fallback = "") {
        return String(data.patientId || data.patientKey || fallback || "").trim().replace(/\//g, "_");
      }

      function patientIdentityFrom(data, fallback = "", ownerUid = "") {
        const existingIdentity = String(data.sharedPatientIdentity || data.patientIdentity || "").trim();
        if (existingIdentity && !existingIdentity.startsWith("mobile_")) return existingIdentity;
        const patientKey = patientKeyFrom(data, fallback);
        return patientKey ? `patient_${ownerUid}_${patientKey}` : "";
      }

      function doctorNameForUid(uid) {
        const user = users.find((item) => (item.uid || item.id) === uid) || {};
        return String(user.name || user.email || "").trim();
      }

      async function rebuildSharedPatientIndex() {
        const groupsByUser = mappedGroupsByUser();
        if (!groupsByUser.size) {
          $("#userStatus").textContent = "No mapped users found.";
          return;
        }
        $("#userStatus").textContent = "Rebuilding shared patient search...";
        let profileCount = 0;
        let recordCount = 0;
        const patientSnapshot = await getDocs(collectionGroup(db, "patients"));
        for (const item of patientSnapshot.docs) {
          const ownerUid = item.ref.parent.parent?.id || "";
          const group = groupsByUser.get(ownerUid);
          if (!group) continue;
          const patient = item.data();
          const patientKey = patientKeyFrom(patient, item.id);
          const patientIdentity = patientIdentityFrom(patient, item.id, ownerUid);
          if (!patientIdentity) continue;
          await setDoc(doc(db, "patientGroups", group, "patients", patientIdentity), {
            patientIdentity,
            sharedPatientIdentity: patientIdentity,
            patientId: patientKey,
            name: patient.name || "",
            age: patient.age || "",
            sex: patient.sex || "",
            mobile: patient.mobile || "",
            diagnosis: patient.diagnosis || "",
            customDiagnosis: patient.customDiagnosis || "",
            comments: Array.isArray(patient.comments) ? patient.comments : [],
            lastVisitDate: patient.date || "",
            updatedAt: new Date().toISOString(),
            updatedByUid: ownerUid,
            indexedBy: auth.currentUser?.email || ""
          }, { merge: true });
          profileCount += 1;
        }
        const recordSnapshot = await getDocs(collectionGroup(db, "medicalRecords"));
        for (const item of recordSnapshot.docs) {
          const ownerUid = item.ref.parent.parent?.id || "";
          const group = groupsByUser.get(ownerUid);
          if (!group) continue;
          const record = item.data();
          const recordIdentity = patientIdentityFrom(record, item.id, ownerUid);
          await setDoc(doc(db, "patientGroups", group, "medicalRecords", item.id), {
            ...record,
            ownerUid,
            doctorName: record.doctorName || doctorNameForUid(ownerUid),
            sharedPatientGroup: group,
            sharedPatientIdentity: recordIdentity,
            indexedAt: new Date().toISOString(),
            indexedBy: auth.currentUser?.email || ""
          }, { merge: true });
          recordCount += 1;
        }
        $("#userStatus").textContent = `Shared search rebuilt: ${profileCount} patients, ${recordCount} records.`;
      }

      $("#loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("#loginError").textContent = "";
        try {
          await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#password").value);
          $("#password").value = "";
        } catch {
          $("#loginError").textContent = "Incorrect email address or password.";
        }
      });

      $("#settingsForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("#settingsStatus").textContent = "Saving...";
        await setDoc(settingsRef(), {
          authorizationKey: $("#authorizationKey").value.trim(),
          speechModel: $("#speechModel").value.trim() === "default" ? "" : $("#speechModel").value.trim(),
          speechEnabled: $("#speechEnabled").checked,
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        $("#settingsStatus").textContent = "Settings saved.";
      });

      $("#groupForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const rawId = $("#groupId").value.trim();
        const name = $("#groupName").value.trim();
        const groupId = rawId.toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
        if (!groupId || !name) {
          $("#userStatus").textContent = "Enter group ID and group name.";
          return;
        }
        $("#userStatus").textContent = "Creating patient group...";
        await setDoc(patientGroupDocRef(groupId), {
          name,
          groupId,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        $("#groupId").value = "";
        $("#groupName").value = "";
        $("#userStatus").textContent = "Patient group saved.";
      });

      $("#manualUserForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const uid = $("#manualUid").value.trim();
        const name = $("#manualName").value.trim();
        const email = $("#manualEmail").value.trim();
        if (!uid || !email) {
          $("#userStatus").textContent = "Enter both UID and email address.";
          return;
        }
        $("#userStatus").textContent = "Adding user...";
        await setDoc(doc(db, "adminUserDirectory", uid), {
          uid,
          name,
          email,
          addedAt: new Date().toISOString(),
          addedBy: auth.currentUser?.email || ""
        }, { merge: true });
        await setDoc(doctorDirectoryRef(uid), {
          uid,
          name,
          email,
          updatedAt: new Date().toISOString(),
          updatedBy: auth.currentUser?.email || ""
        }, { merge: true });
        await setDoc(userFeatureRef(uid), defaultFeatures, { merge: true });
        $("#manualUid").value = "";
        $("#manualName").value = "";
        $("#manualEmail").value = "";
        $("#userStatus").textContent = "User added.";
      });

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-save-user]");
        if (button) {
          await saveUserFeatures(button.dataset.saveUser);
          return;
        }
        const deviceButton = event.target.closest("[data-device-action]");
        if (!deviceButton) return;
        await setDeviceStatus(deviceButton.dataset.deviceUser, deviceButton.dataset.deviceId, deviceButton.dataset.deviceAction);
      });

      $("#userSearch").addEventListener("input", (event) => {
        userSearchQuery = event.target.value;
        renderUsers();
      });

      $("#rebuildSharedPatientIndexBtn").addEventListener("click", async () => {
        try {
          $("#rebuildSharedPatientIndexBtn").disabled = true;
          await rebuildSharedPatientIndex();
        } catch (error) {
          console.error("Shared patient search rebuild failed", error);
          $("#userStatus").textContent = "Shared search rebuild failed. Check rules and admin access.";
        } finally {
          $("#rebuildSharedPatientIndexBtn").disabled = false;
        }
      });

      $("#toggleKeyBtn").addEventListener("click", () => {
        const input = $("#authorizationKey");
        input.type = input.type === "password" ? "text" : "password";
        $("#toggleKeyBtn").textContent = input.type === "password" ? "Show" : "Hide";
      });

      $("#signOutBtn").addEventListener("click", () => signOut(auth));

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          $("#loginPanel").hidden = false;
          $("#adminPanel").hidden = true;
          return;
        }
        if (!isAdmin(user)) {
          await signOut(auth);
          $("#loginError").textContent = "This account is not allowed to open Admin Console.";
          return;
        }
        $("#loginPanel").hidden = true;
        $("#adminPanel").hidden = false;
        $("#signedInLabel").textContent = `Signed in: ${user.email}`;
        startUserWatch();
        try {
          await loadSettings();
        } catch {
          $("#settingsStatus").textContent = "Settings could not load. Check admin access rules.";
        }
      });
    </script>
  </body>
</html>
